<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020205" />
      <stop offset="50%" stop-color="#0e0f26" />
      <stop offset="100%" stop-color="#18153b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#glowGrad)" stroke-width="3" stroke-opacity="0.4" />

  <!-- Outer Glowing AI Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#glowGrad)" stroke-width="12" stroke-dasharray="16 12" filter="url(#glow)" opacity="0.8" />

  <!-- Success Hub Crown Spark Structure -->
  <g filter="url(#glow)">
    <!-- Central Hex/Spark -->
    <path d="M 256 120 L 330 180 L 330 280 L 256 340 L 182 280 L 182 180 Z" fill="none" stroke="url(#glowGrad)" stroke-width="16" stroke-linejoin="round" />
    
    <!-- Inner Spark Star -->
    <path d="M 256 160 Q 256 256 160 256 Q 256 256 256 352 Q 256 256 352 256 Q 256 256 256 160 Z" fill="url(#glowGrad)" />

    <!-- AI Dots -->
    <circle cx="256" cy="120" r="10" fill="#a855f7" />
    <circle cx="330" cy="180" r="10" fill="#06b6d4" />
    <circle cx="330" cy="280" r="10" fill="#6366f1" />
    <circle cx="256" cy="340" r="10" fill="#a855f7" />
    <circle cx="182" cy="280" r="10" fill="#06b6d4" />
    <circle cx="182" cy="180" r="10" fill="#6366f1" />
  </g>
</svg>
